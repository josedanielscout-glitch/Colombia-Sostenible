        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            overflow-x: hidden;
        }
        
        /* Animaciones base */
        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Utilidades Glassmorphism Premium */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -4px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        /* Fondos Animados (Blobs) */
        .blob-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background: #f1f5f9;
        }
        .blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #a7f3d0; animation-delay: 0s; }
        .blob-2 { top: 40%; right: -10%; width: 40vw; height: 40vw; background: #bae6fd; animation-delay: -5s; }
        .blob-3 { bottom: -20%; left: 20%; width: 60vw; height: 60vw; background: #fef08a; opacity: 0.4; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.1); }
            100% { transform: translate(-5%, 5%) scale(0.9); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

        ];

        const wizardFlow = {
            start: { question: "¿El objeto todavía funciona o cumple su función?", options: [{ text: "Sí, funciona perfectamente", next: "check_buy" }, { text: "Funciona, pero no lo quiero", next: "check_reuse" }, { text: "No, está roto o dañado", next: "check_repair" }] },
            check_buy: { question: "¿Es algo que vas a comprar o ya lo tienes en casa?", options: [{ text: "Lo voy a comprar", next: "result_r0" }, { text: "Ya lo tengo", next: "result_r1" }] },
            check_reuse: { question: "¿Crees que alguien más lo podría usar?", options: [{ text: "Sí, está en buen estado", next: "result_r3" }, { text: "No, está feo o desgastado", next: "check_restore" }] },
            check_restore: { question: "¿Si lo arreglaras un poco, te lo quedarías o alguien lo querría?", options: [{ text: "Sí, con una 'manito de gato' aguanta", next: "result_r5" }, { text: "No, no vale la pena", next: "check_repurpose" }] },
            check_repair: { question: "¿Crees que tiene arreglo? (Coser, pegar, cambiar pieza)", options: [{ text: "Sí, se puede arreglar", next: "result_r4" }, { text: "No, el daño es grave", next: "check_parts" }] },
            check_parts: { question: "¿Tiene partes complejas que sirvan de repuesto?", options: [{ text: "Sí, tiene componentes útiles", next: "result_r6" }, { text: "No, es material simple", next: "check_repurpose" }] },
            check_repurpose: { question: "¿Se te ocurre otro uso creativo? (Upcycling)", options: [{ text: "Sí, tengo una idea", next: "result_r7" }, { text: "No, ni idea", next: "result_r8" }] }
        };

        const HeroCarousel = () => {
            const slides = [
                { title: "Colombia Sostenible", subtitle: "Nuestra biodiversidad depende de lo que hagas hoy.", image: "https://images.pexels.com/photos/15699963/pexels-photo-15699963.jpeg?auto=compress&cs=tinysrgb&w=1600" },
                { title: "¿Basura o Tesoro?", subtitle: "Aprende a diferenciar antes de botar.", image: "https://images.pexels.com/photos/3951381/pexels-photo-3951381.jpeg?auto=compress&cs=tinysrgb&w=1600" },
                { title: "Compra Local", subtitle: "Apoya a nuestros campesinos y reduce empaques.", image: "https://images.pexels.com/photos/2733918/pexels-photo-2733918.jpeg?auto=compress&cs=tinysrgb&w=1600" },
                { title: "Compostaje en Casa", subtitle: "Transforma tus residuos orgánicos en vida.", image: "https://images.pexels.com/photos/3050720/pexels-photo-3050720.jpeg?auto=compress&cs=tinysrgb&w=1600" }
            ];

            const [current, setCurrent] = useState(0);

            useEffect(() => {
                const timer = setInterval(() => setCurrent(p => (p + 1) % slides.length), 6000);
                return () => clearInterval(timer);
            }, [slides.length]);

            return (
                <div className="relative w-full h-[450px] md:h-[550px] overflow-hidden rounded-[2rem] shadow-2xl mb-10 mt-6 group">
                    {slides.map((slide, index) => (
                        <div key={index} className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${index === current ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}>
                            <div className="absolute inset-0 bg-cover bg-center transition-transform duration-[10000ms] ease-out scale-105"
                                 style={{ backgroundImage: `url('${slide.image}')`, transform: index === current ? 'scale(1)' : 'scale(1.1)' }} />
                            {/* Overlay Gradient suave */}
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent"></div>
                            
                            <div className="absolute bottom-0 left-0 right-0 p-8 md:p-16 text-white max-w-5xl mx-auto flex flex-col justify-end h-full">
                                <h2 className="text-5xl md:text-7xl font-black mb-4 drop-shadow-lg tracking-tight animate-in slide-up">
                                    {slide.title}
                                </h2>
                                <p className="text-xl md:text-3xl font-light text-slate-200 drop-shadow-md animate-in fade-in" style={{animationDelay: '0.2s'}}>
                                    {slide.subtitle}
                                </p>
                            </div>
                        </div>
                    ))}
                    
                    {/* Navigation Dots */}
                    <div className="absolute bottom-8 right-8 md:right-16 z-20 flex gap-2">
                        {slides.map((_, idx) => (
                            <button key={idx} onClick={() => setCurrent(idx)}
                                className={`h-2 rounded-full transition-all duration-300 ${idx === current ? 'w-12 bg-emerald-400' : 'w-4 bg-white/50 hover:bg-white/80'}`} />
                        ))}
                    </div>
                </div>
            );
        };

        const BentoCards = ({ dailyChallenge, generateChallenge }) => (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                {/* Challenge Card */}
                <div className="md:col-span-2 glass-panel rounded-[2rem] p-8 md:p-10 relative overflow-hidden group flex flex-col justify-center min-h-[280px]">
                    <div className="absolute inset-0 bg-cover bg-center opacity-10 mix-blend-multiply group-hover:scale-105 transition-transform duration-700" 
                         style={{ backgroundImage: "url('https://images.pexels.com/photos/3850512/pexels-photo-3850512.jpeg?auto=compress&cs=tinysrgb&w=1600')" }}></div>
                    
                    <div className="relative z-10">
                        <div className="flex items-center gap-4 mb-6">
                            <div className="bg-emerald-100 p-3 rounded-2xl text-emerald-600 shadow-sm">
                                <Icons.Zap size={28} className="fill-emerald-200" />
                            </div>
                            <h3 className="text-2xl font-bold text-slate-800 tracking-tight">Reto Eco-Diario</h3>
                        </div>
                        <p className="text-3xl text-slate-700 mb-8 font-medium leading-tight max-w-xl">
                            {dailyChallenge || "¿Te le mides a un reto sostenible hoy?"}
                        </p>
                        <button onClick={generateChallenge} className="bg-slate-900 text-white px-8 py-3.5 rounded-full font-semibold hover:bg-emerald-600 transition-colors flex items-center gap-3 w-fit shadow-lg shadow-slate-900/20 active:scale-95">
                            <Icons.RefreshCcw size={20} className={dailyChallenge ? "animate-spin-once" : ""} />
                            {dailyChallenge ? "Dame otro reto" : "Generar Reto"}
                        </button>
                    </div>
                </div>
                
                {/* Fact Card */}
                <div className="glass-panel rounded-[2rem] p-8 md:p-10 flex flex-col justify-center relative overflow-hidden min-h-[280px] bg-gradient-to-br from-emerald-600 to-teal-800 text-white border-none shadow-xl shadow-emerald-900/20">
                    <Icons.Leaf className="absolute -bottom-10 -right-10 w-64 h-64 opacity-10 rotate-12" />
                    <div className="relative z-10">
                        <span className="text-emerald-200 text-xs font-bold uppercase tracking-widest mb-3 block">Dato Rápido</span>
                        <h4 className="text-6xl font-black mb-2 tracking-tighter">12M</h4>
                        <p className="font-medium text-lg text-emerald-50 leading-tight mb-4">Toneladas de basura al año en Colombia.</p>
                        <div className="bg-black/20 backdrop-blur-md px-4 py-2 rounded-xl inline-block text-sm font-semibold border border-white/10">
                            Solo reciclamos el 17%
                        </div>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [activeTab, setActiveTab] = useState('explore'); 
            const [wizardCurrentNode, setWizardCurrentNode] = useState('start');
            const [wizardFinished, setWizardFinished] = useState(false);
            const [wizardResult, setWizardResult] = useState(null);
            const [selectedR, setSelectedR] = useState(null);
            const [completedTips, setCompletedTips] = useState({});
            const [searchTerm, setSearchTerm] = useState("");
            const [dailyChallenge, setDailyChallenge] = useState(null);

            const filteredRs = rData.filter(item => 
                item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.examples || []).some(ex => ex.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const generateChallenge = () => setDailyChallenge(dailyChallenges[Math.floor(Math.random() * dailyChallenges.length)]);
            const toggleTip = (rId, i) => setCompletedTips(p => ({ ...p, [`${rId}-${i}`]: !p[`${rId}-${i}`] }));
            
            const handleWizardOption = (nextStep) => {
                if (nextStep.startsWith('result_')) {
                    setWizardResult({ status: 'success', data: rData.find(r => r.id === nextStep.replace('result_', '')) });
                    setWizardFinished(true);
                } else setWizardCurrentNode(nextStep);
            };

            const RenderIcon = ({ name, size = 24, className = "" }) => {
                const IconComponent = Icons[name] || Icons.HelpCircle;
                return <IconComponent size={size} className={className} />;
            };

            return (
                <div className="min-h-screen p-4 md:p-8 relative z-10">
                    <div className="max-w-7xl mx-auto">
                        <HeroCarousel />
                        <BentoCards dailyChallenge={dailyChallenge} generateChallenge={generateChallenge} />

                        {/* Main Glass Container */}
                        <div className="glass-panel rounded-[2.5rem] p-4 md:p-8 mb-12">
                            
                            {/* Floating Nav */}
                            <div className="flex flex-col md:flex-row bg-slate-100/50 p-2 rounded-full mb-10 max-w-3xl mx-auto">
                                {[
                                    { id: 'explore', label: 'Explorar', icon: 'Search' },
                                    { id: 'wizard', label: 'Asistente', icon: 'HelpCircle' },
                                    { id: 'trivia', label: 'Trivia', icon: 'Brain' }
                                ].map((tab) => (
                                    <button 
                                        key={tab.id} onClick={() => setActiveTab(tab.id)}
                                        className={`flex-1 py-3 px-6 text-center font-semibold text-base transition-all duration-300 flex items-center justify-center gap-2 rounded-full ${
                                            activeTab === tab.id 
                                            ? 'bg-white text-slate-900 shadow-md scale-100' 
                                            : 'text-slate-500 hover:text-slate-800 hover:bg-white/40'
                                        }`}
                                    >
                                        <RenderIcon name={tab.icon} size={18} className={activeTab === tab.id ? "text-emerald-500" : ""} />
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            <div className="min-h-[500px]">
                                {/* EXPLORE TAB */}
                                {activeTab === 'explore' && (
                                <div className="animate-in fade-in">
                                    {!selectedR ? (
                                    <>
                                        <div className="flex flex-col md:flex-row items-center justify-between mb-10 gap-6 px-4">
                                            <div>
                                                <h2 className="text-3xl font-black text-slate-800 tracking-tight">La Escalera Circular</h2>
                                                <p className="text-slate-500 font-medium mt-1">Nueve formas de salvar el planeta, de mayor a menor impacto.</p>
                                            </div>
                                            <div className="relative w-full md:w-80 group">
                                                <Icons.Search size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-emerald-500" />
                                                <input type="text" placeholder="Buscar (ej. plástico...)" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                                                    className="w-full pl-12 pr-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition-all outline-none text-slate-700 shadow-sm backdrop-blur-md"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {filteredRs.map((item) => (
                                            <div key={item.id} onClick={() => setSelectedR(item)} className="glass-card rounded-[2rem] p-8 cursor-pointer flex flex-col group relative overflow-hidden h-full">
                                                <div className={`absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${item.color} opacity-10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2`}></div>
                                                
                                                <div className="flex justify-between items-start mb-6">
                                                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center bg-gradient-to-br ${item.color} shadow-lg shadow-${item.color.split('-')[1]}/30 text-white transform group-hover:scale-110 transition-transform duration-300`}>
                                                        <RenderIcon name={item.icon} size={28} />
                                                    </div>
                                                    <span className={`text-xs font-bold uppercase tracking-widest ${item.textDark} bg-${item.color.split('-')[1]}-50 px-3 py-1 rounded-full`}>
                                                        {item.english}
                                                    </span>
                                                </div>
                                                
                                                <h3 className="text-2xl font-black text-slate-800 mb-2 tracking-tight">{item.name.split(': ')[1]}</h3>
                                                <p className="text-slate-600 font-medium mb-6 flex-grow text-sm leading-relaxed">{item.description}</p>
                                                
                                                {searchTerm && (item.examples || []).some(ex => ex.toLowerCase().includes(searchTerm.toLowerCase())) && (
                                                    <div className="bg-white/60 p-3 rounded-xl text-xs mb-4 shadow-sm border border-white/50 text-slate-600">
                                                        <span className="font-bold text-emerald-600">Ejemplo:</span> {(item.examples || []).find(ex => ex.toLowerCase().includes(searchTerm.toLowerCase()))}
                                                    </div>
                                                )}

                                                <div className="mt-auto flex items-center text-sm font-bold text-slate-400 group-hover:text-slate-800 transition-colors">
                                                    <span>Explorar guía</span>
                                                    <Icons.ArrowRight size={16} className="ml-2 transform group-hover:translate-x-1 transition-transform" />
                                                </div>
                                            </div>
                                            ))}
                                        </div>
                                    </>
                                    ) : (
                                    <div className="animate-in slide-up">
                                        <button onClick={() => setSelectedR(null)} className="mb-6 flex items-center text-slate-500 hover:text-slate-800 font-semibold px-4 py-2 bg-white/50 rounded-full shadow-sm w-fit hover:bg-white transition-all">
                                            <Icons.ChevronLeft size={18} className="mr-1" /> Volver
                                        </button>

                                        <div className="glass-card rounded-[2.5rem] overflow-hidden border-0 shadow-2xl">
                                            {/* Hero Image Section */}
                                            <div className="relative h-64 md:h-80 w-full overflow-hidden">
                                                <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: `url('${selectedR.image}')` }} />
                                                <div className={`absolute inset-0 bg-gradient-to-r ${selectedR.color} opacity-80 mix-blend-multiply`}></div>
                                                <div className="absolute inset-0 bg-gradient-to-t from-slate-900/90 to-transparent"></div>
                                                
                                                <div className="absolute bottom-0 left-0 p-8 md:p-12 text-white">
                                                    <div className="flex items-center gap-3 mb-3">
                                                        <RenderIcon name={selectedR.icon} size={24} className={selectedR.textLight} />
                                                        <span className={`font-bold tracking-widest uppercase text-sm ${selectedR.textLight}`}>{selectedR.english}</span>
                                                    </div>
                                                    <h2 className="text-4xl md:text-6xl font-black tracking-tight drop-shadow-md">{selectedR.name}</h2>
                                                </div>
                                            </div>
                                            
                                            <div className="p-8 md:p-12 grid grid-cols-1 lg:grid-cols-2 gap-12 bg-white/40">
                                                <div className="space-y-8">
                                                    <div>
                                                        <h3 className="text-xl font-bold text-slate-800 mb-3 flex items-center gap-2"><Icons.Info size={20} className="text-slate-400"/> Concepto</h3>
                                                        <p className="text-slate-600 leading-relaxed text-lg">{selectedR.longDescription}</p>
                                                    </div>
                                                    <div>
                                                        <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Star size={20} className="text-yellow-500 fill-current"/> Beneficios</h3>
                                                        <ul className="space-y-3">
                                                            {(selectedR.benefits || []).map((b, i) => (
                                                                <li key={i} className="flex items-start gap-3 text-slate-700 font-medium bg-white/60 p-4 rounded-xl shadow-sm border border-white">
                                                                    <Icons.CheckCircle size={20} className="text-emerald-500 shrink-0 mt-0.5" /> {b}
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                    <div>
                                                        <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Lightbulb size={20} className="text-orange-500 fill-current"/> Ejemplos Reales</h3>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                            {(selectedR.examples || []).map((ex, i) => (
                                                                <div key={i} className="flex items-start gap-3 p-3 bg-white/60 rounded-xl shadow-sm border border-white">
                                                                    <div className="min-w-2 h-2 rounded-full bg-orange-400 mt-2"></div>
                                                                    <span className="text-slate-700 text-sm font-medium">{ex}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                <div className="bg-slate-50/80 rounded-[2rem] p-8 border border-white shadow-inner flex flex-col">
                                                    <h3 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"><Icons.Check size={20} className="text-emerald-500 stroke-[3]"/> Checklist de Acción</h3>
                                                    <div className="space-y-3 relative z-10 flex-grow">
                                                        {(selectedR.tips || []).map((tip, i) => {
                                                            const isDone = completedTips[`${selectedR.id}-${i}`];
                                                            return (
                                                                <div key={i} onClick={() => toggleTip(selectedR.id, i)} className={`cursor-pointer p-4 rounded-xl transition-all duration-300 flex items-center gap-4 border ${isDone ? 'bg-emerald-500 border-emerald-400 shadow-md text-white' : 'bg-white border-white shadow-sm text-slate-700 hover:border-emerald-200'}`}>
                                                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${isDone ? 'border-white bg-white/20' : 'border-slate-300'}`}>
                                                                        {isDone && <Icons.Check size={14} className="text-white stroke-[4]" />}
                                                                    </div>
                                                                    <p className="font-semibold">{tip}</p>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    )}
                                </div>
                                )}

                                {}
                                {/* WIZARD TAB */}
                                {activeTab === 'wizard' && (
                                <div className="max-w-3xl mx-auto animate-in fade-in py-8">
                                    {!wizardFinished ? (
                                    <div className="text-center relative">
                                        {wizardCurrentNode !== 'start' && (
                                            <button onClick={() => setWizardCurrentNode('start')} className="absolute -top-10 left-0 text-slate-500 hover:text-slate-800 text-sm font-semibold flex items-center gap-1">
                                                <Icons.RotateCcw size={16} /> Reiniciar
                                            </button>
                                        )}
                                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-emerald-100 to-teal-100 text-teal-600 mb-8 shadow-inner">
                                            <Icons.Brain size={40} />
                                        </div>
                                        <h2 className="text-3xl font-black text-slate-800 mb-10 tracking-tight">
                                            {wizardFlow[wizardCurrentNode]?.question}
                                        </h2>
                                        <div className="grid gap-4">
                                            {(wizardFlow[wizardCurrentNode]?.options || []).map((opt, idx) => (
                                                <button key={idx} onClick={() => handleWizardOption(opt.next)} className="glass-card w-full p-6 rounded-2xl text-left font-bold text-xl text-slate-700 hover:text-slate-900 flex justify-between items-center group">
                                                    {opt.text}
                                                    <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center group-hover:bg-emerald-100 group-hover:text-emerald-600 transition-colors">
                                                        <Icons.ArrowRight size={20} />
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    ) : (
                                    <div className="glass-card rounded-[3rem] p-10 md:p-16 text-center shadow-2xl relative overflow-hidden animate-in zoom-in-95">
                                        <div className={`absolute top-0 left-0 w-full h-3 bg-gradient-to-r ${wizardResult.data.color}`}></div>
                                        <div className="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-slate-50 text-slate-800 mb-6 shadow-md border border-white">
                                            <RenderIcon name={wizardResult.data.icon} size={48} className={wizardResult.data.textDark} />
                                        </div>
                                        <h2 className="text-4xl font-black text-slate-800 mb-2">¡Aplica la {wizardResult.data.name.split(':')[0]}!</h2>
                                        <p className="text-xl text-slate-500 font-medium mb-8 uppercase tracking-widest">{wizardResult.data.name.split(':')[1]}</p>
                                        
                                        <div className="bg-white/60 p-6 rounded-2xl mb-8 border border-white text-left">
                                            <p className="text-lg text-slate-700 font-medium mb-4">{wizardResult.data.description}</p>
                                            
                                            <h4 className="font-black text-slate-500 text-sm uppercase tracking-widest border-b border-slate-200/50 pb-2 mb-3">Pilas con esto (Tips):</h4>
                                            <ul className="space-y-3">
                                                {(wizardResult.data.tips || []).map((tip, i) => (
                                                <li key={i} className="text-slate-600 flex items-start gap-3 font-medium text-sm">
                                                    <div className="min-w-5 h-5 bg-emerald-400 rounded-full flex items-center justify-center text-white font-bold text-xs mt-0.5 shadow-sm">!</div>
                                                    {tip}
                                                </li>
                                                ))}
                                            </ul>
                                        </div>
                                        
                                        <button onClick={() => {setWizardCurrentNode('start'); setWizardFinished(false);}} className="bg-slate-900 text-white px-8 py-4 rounded-full font-bold shadow-lg hover:bg-slate-800 transition-colors active:scale-95">
                                            Analizar otro objeto
                                        </button>
                                    </div>
                                    )}
                                </div>
                                )}

                                {/* TRIVIA TAB */}
                                {activeTab === 'trivia' && (
                                    <div className="max-w-2xl mx-auto animate-in fade-in py-8">
                                        <div className="glass-card rounded-[2.5rem] p-8 shadow-xl">
                                            <div className="flex justify-between items-center mb-8 pb-6 border-b border-slate-200/50">
                                                <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2"><Icons.Award className="text-emerald-500"/> Eco-Trivia</h3>
                                                <span className="bg-slate-100 text-slate-600 font-bold px-4 py-1.5 rounded-full text-sm">Pregunta al azar</span>
                                            </div>
                                            <p className="text-xl font-bold text-slate-700 mb-8 leading-relaxed text-center">
                                                {triviaData[0].question}
                                            </p>
                                            <div className="space-y-3">
                                                {triviaData[0].options.map((opt, i) => (
                                                    <button key={i} className="w-full p-4 rounded-xl bg-white/60 border border-white text-slate-700 font-semibold text-lg hover:bg-emerald-50 hover:border-emerald-200 hover:text-emerald-700 transition-all text-left shadow-sm">
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {}
                        <div className="text-center py-6 text-slate-400 font-medium text-sm">
                            <p>Diseñado con 💚 para Colombia. Interfaz Glassmorphism.</p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
